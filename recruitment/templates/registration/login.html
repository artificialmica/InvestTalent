<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InvestTalent-AI</title>
    
    <!-- Google Fonts: Playfair Display + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================
           INVESTTALENT-AI DESIGN SYSTEM
           Color Palette: Navy + Gold
           ============================================ */
        :root {
            --primary-dark: #1B3C53;
            --primary: #234C6A;
            --primary-light: #456882;
            --gray-light: #E3E3E3;
            --white: #FFFFFF;
            --off-white: #F8F9FA;
            --gray-medium: #9AACB8;
            --text-primary: #1B3C53;
            --text-secondary: #456882;
            --text-muted: #6B7C88;
            --accent-gold: #C9A227;
            --accent-gold-light: #D4B84A;
            --success: #2D8659;
            --success-light: #E8F5EE;
            --warning: #D4A012;
            --warning-light: #FDF6E3;
            --danger: #C23B3B;
            --danger-light: #FCEAEA;
            --info: #2D7D9A;
            --info-light: #E8F4F8;
            --font-heading: 'Playfair Display', Georgia, serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --shadow-sm: 0 1px 2px rgba(27, 60, 83, 0.05);
            --shadow-md: 0 4px 12px rgba(27, 60, 83, 0.08);
            --shadow-lg: 0 12px 40px rgba(27, 60, 83, 0.15);
            --radius-md: 8px;
            --radius-lg: 12px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-body);
            background: var(--primary-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: var(--white);
            padding: 44px 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo h1 {
            font-family: var(--font-heading);
            font-size: 28px;
            color: var(--text-primary);
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        
        .logo p {
            color: var(--text-muted);
            font-size: 13px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 13px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--gray-light);
            border-radius: var(--radius-md);
            font-size: 15px;
            font-family: var(--font-body);
            color: var(--text-primary);
            transition: all 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(35, 76, 106, 0.1);
        }
        
        .form-group input::placeholder {
            color: var(--gray-medium);
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-dark);
            color: var(--white);
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            font-family: var(--font-body);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .login-btn:hover {
            background: var(--primary);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        .error-message {
            background: var(--danger-light);
            border-left: 4px solid var(--danger);
            color: var(--danger);
            padding: 14px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .demo-credentials {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--gray-light);
        }
        
        .demo-credentials h3 {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 14px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }
        
        .credential-card {
            background: var(--off-white);
            padding: 12px 14px;
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        
        .credential-card:hover {
            background: rgba(35, 76, 106, 0.05);
        }
        
        .credential-card:last-child {
            margin-bottom: 0;
        }
        
        .credential-card .role {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
        }
        
        .credential-card .role.hr-admin {
            color: var(--danger);
        }
        
        .credential-card .role.manager {
            color: var(--accent-gold);
        }
        
        .credential-card .role.executive {
            color: var(--info);
        }
        
        .credential-card .creds {
            font-size: 11px;
            color: var(--text-muted);
            text-align: right;
        }
        
        .credential-card .creds code {
            background: var(--gray-light);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }
            
            .logo h1 {
                font-size: 24px;
            }
            
            .credential-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            
            .credential-card .creds {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>InvestTalent-AI</h1>
            <p>AI-Powered Recruitment System</p>
        </div>
        
        {% if form.errors %}
        <div class="error-message">
            Invalid username or password. Please try again.
        </div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>
            </div>
            
            <button type="submit" class="login-btn">Sign In</button>
        </form>
        
        <div class="demo-credentials">
            <h3>Demo Accounts</h3>
            
            <div class="credential-card">
                <span class="role hr-admin">HR Admin</span>
                <span class="creds">
                    <code>hr_admin</code> / <code>HRAdmin123!</code>
                </span>
            </div>
            
            <div class="credential-card">
                <span class="role manager">Hiring Manager</span>
                <span class="creds">
                    <code>manager</code> / <code>Manager123!</code>
                </span>
            </div>
            
            <div class="credential-card">
                <span class="role executive">Executive</span>
                <span class="creds">
                    <code>executive</code> / <code>Executive123!</code>
                </span>
            </div>
        </div>
    </div>
</body>
</html>
